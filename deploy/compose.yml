name: hachimi-competition

services:
  app:
    image: ${HACHIMI_IMAGE:?Set HACHIMI_IMAGE to an immutable commit SHA tag}
    restart: unless-stopped
    command:
      - services/analysis-api/.venv/bin/uvicorn
      - hakimi_analysis.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --no-proxy-headers
    env_file:
      - /opt/hachimi/shared/.env.production
    environment:
      APP_ENV: production
      SOURCE_MANIFEST_PATH: /config/media-manifest.json
      SOURCE_MEDIA_ROOT: /var/lib/hachimi/media
      WEB_STATIC_ROOT: /workspace/apps/web/dist
      TRUSTED_PROXY_CIDRS: 172.30.248.2/32
    expose:
      - "8000"
    volumes:
      - /opt/hachimi/current/media-manifest.json:/config/media-manifest.json:ro
      - /var/lib/hachimi/media:/var/lib/hachimi/media:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /workspace/tmp/analysis-runs:size=768m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    networks:
      competition:
        ipv4_address: 172.30.248.3
    healthcheck:
      test:
        - CMD
        - services/analysis-api/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      competition:
        ipv4_address: 172.30.248.2

volumes:
  caddy_data:
  caddy_config:

networks:
  competition:
    ipam:
      config:
        - subnet: 172.30.248.0/29
