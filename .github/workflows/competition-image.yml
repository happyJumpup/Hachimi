name: Competition image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - competition/web-mvp
  push:
    branches:
      - main
      - competition/web-mvp

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      AUDIT_IMAGE: hachimi-competition-audit:${{ github.sha }}
      SOURCE_AUDIT_IMAGE: hachimi-source-package-audit:${{ github.sha }}
      PUBLISH_IMAGE: ghcr.io/happyjumpup/hachimi:${{ github.sha }}
    steps:
      # Optional registry supply-chain artifact. CloudBase production continues
      # to use the verified source-package path until target pull/rollback passes.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/happyjumpup/hachimi
          tags: type=raw,value=${{ github.sha }}

      - name: Prepare immutable CloudBase source package
        shell: pwsh
        run: >-
          ./deploy/cloudbase/package-source.ps1
          -CommitSha '${{ github.sha }}'
          -OutputDirectory '${{ runner.temp }}/trainpal-cloudbase-source'

      - name: Build CloudBase source-package image for verification
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/trainpal-cloudbase-source
          load: true
          push: false
          tags: ${{ env.SOURCE_AUDIT_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit CloudBase source-package image
        run: >-
          bash ./deploy/verify-competition-image.sh
          "$SOURCE_AUDIT_IMAGE"
          "${{ github.sha }}"

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.AUDIT_IMAGE }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            TRAINPAL_BUILD_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit image and run container smoke
        run: bash ./deploy/verify-competition-image.sh "$AUDIT_IMAGE" "${{ github.sha }}"

      - name: Validate Caddyfile
        run: >-
          docker run --rm
          --env APP_DOMAIN=localhost
          --env ACME_EMAIL=ci@example.invalid
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.0-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Compose configuration
        env:
          HACHIMI_IMAGE: ${{ env.AUDIT_IMAGE }}
          APP_DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: |
          set -Eeuo pipefail
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /opt/hachimi/shared
          install -m 0600 /dev/null /opt/hachimi/shared/.env.production
          rendered="$(docker compose --file deploy/compose.yml config --no-env-resolution --format json)"
          jq --exit-status '.services.app.stop_grace_period == "4m0s"' <<<"$rendered"

      - name: Log in to GHCR after verification
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact local image that passed every gate above. This workflow
      # does not claim registry-attached provenance or SBOM attestations.
      - name: Publish audited commit image
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail
          docker tag "$AUDIT_IMAGE" "$PUBLISH_IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$AUDIT_IMAGE")" = \
            "$(docker image inspect --format '{{.Id}}' "$PUBLISH_IMAGE")"
          docker push "$PUBLISH_IMAGE"
